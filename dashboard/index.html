<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel GPS — Equipes de Campo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        html, body { width:100%; height:100%; font-family:'Inter',sans-serif; background:#0f1117; color:#e2e8f0; overflow:hidden; }

        #app { display:flex; width:100vw; height:100vh; }

        /* ── SIDEBAR ── */
        .sidebar {
            width: 320px;
            background: #002d62; /* Mundonet Blue */
            display: flex;
            flex-direction: column;
            border-right: 1px solid #1e293b;
            z-index: 1000;
        }
        .sidebar-header {
            padding: 25px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .sidebar-header img {
            max-width: 180px;
            height: auto;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 5px rgba(0,0,0,0.5));
        }
        .sidebar-header h1 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #fff;
            margin: 0;
        }

        #stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:12px; flex-shrink:0; border-bottom:1px solid #2d3148; }
        .sbox { background:#23263a; border-radius:8px; padding:10px; text-align:center; }
        .sbox b { display:block; font-size:22px; font-weight:700; color:#39B8FF; }
        .sbox small { font-size:10px; color:#6b7280; }

        #team-list { flex:1; overflow-y:auto; padding:10px; }
        #team-list::-webkit-scrollbar { width:4px; }
        #team-list::-webkit-scrollbar-thumb { background:#4318FF; border-radius:4px; }

        .tcard {
            background:#23263a; border:1px solid #2d3148;
            border-radius:10px; padding:12px; margin-bottom:8px;
            cursor:pointer; transition:border-color .2s, background .2s;
        }
        .tcard:hover { border-color:#4318FF; background:#1e2040; }
        .tcard-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
        .tcard-name { font-size:14px; font-weight:600; color:#f1f5f9; }
        .badge { font-size:10px; font-weight:700; padding:2px 8px; border-radius:20px; text-transform:uppercase; }
        .badge-on  { background:#052e16; color:#22c55e; }
        .badge-off { background:#2d0e0e; color:#ef4444; }
        .tcard-metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:5px; margin-bottom:6px; }
        .tm { background:#1a1d27; border-radius:6px; padding:6px; text-align:center; }
        .tm b { display:block; font-size:12px; font-weight:700; color:#e2e8f0; }
        .tm small { font-size:9px; color:#6b7280; }
        .tcard-time { font-size:10px; color:#4b5563; margin-bottom:6px; }
        .btn-focus {
            width:100%; padding:6px; border:none; border-radius:6px;
            background:linear-gradient(135deg,#4318FF,#39B8FF);
            color:#fff; font-size:11px; font-weight:600; cursor:pointer;
        }
        .empty-state { text-align:center; color:#4b5563; font-size:13px; padding-top:40px; }

        /* ── MAP ── */
        #map-wrap { flex:1; position:relative; }
        #map { width:100%; height:100%; }

        /* ── DETAIL PANEL ── */
        #detail {
            display:none; position:absolute; top:14px; right:14px; width:260px;
            background:#1a1d27; border:1px solid #4318FF; border-radius:12px;
            padding:16px; z-index:1000; box-shadow:0 8px 32px rgba(0,0,0,.5);
        }
        #detail h3 { font-size:13px; font-weight:700; color:#fff; margin-bottom:12px; }
        .drow { display:flex; justify-content:space-between; margin-bottom:7px; font-size:11px; }
        .drow span:first-child { color:#6b7280; }
        .drow span:last-child  { color:#e2e8f0; font-weight:600; }
        #dp-stops { max-height:120px; overflow-y:auto; margin-top:6px; }
        .stop-item { background:#23263a; border-radius:5px; padding:5px 8px; margin-bottom:3px; font-size:10px; color:#9ca3af; }
        #btn-close-detail { width:100%; margin-top:10px; padding:6px; border:none; border-radius:6px; background:#ef4444; color:#fff; font-size:11px; font-weight:600; cursor:pointer; }

        .legend {
            position:absolute; bottom:24px; left:12px; z-index:1000;
            background:rgba(26,29,39,.85); backdrop-filter:blur(8px);
            border-radius:8px; padding:8px 12px; font-size:10px; color:#9ca3af;
        }
        .litem { display:flex; align-items:center; gap:6px; margin-bottom:3px; }
        .lline { width:20px; height:3px; border-radius:2px; }
    </style>
</head>
<body>
<div id="app">
    <div class="sidebar">
        <div class="sidebar-header">
            <img src="logo.png" alt="Mundonet Telecom">
            <h1>GPS Tracker</h1>
            <p style="font-size: 11px; opacity: 0.7;">Monitoramento de Equipes</p>
        </div>
        <div id="stats">
            <div class="sbox"><b id="cnt-on">0</b><small>Online</small></div>
            <div class="sbox"><b id="cnt-total">0</b><small>Total</small></div>
        </div>
        <div style="display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid #2d3148;flex-shrink:0;">
            <button onclick="clearOffline()" style="flex:1;padding:7px;border:none;border-radius:7px;background:#7f1d1d;color:#fca5a5;font-size:11px;font-weight:600;cursor:pointer;">🗑 Limpar Offline</button>
            <button onclick="clearAll()"     style="flex:1;padding:7px;border:none;border-radius:7px;background:#1e2040;color:#9ca3af;font-size:11px;font-weight:600;cursor:pointer;">✕ Limpar Todos</button>
        </div>
        <div id="team-list"><div class="empty-state">Nenhuma equipe conectada.</div></div>
    </div>

    <div id="map-wrap">
        <div id="map"></div>

        <div id="detail">
            <h3 id="dp-name">Detalhes da Equipe</h3>
            <div class="drow"><span>Velocidade Atual</span><span id="dp-speed">—</span></div>
            <div class="drow"><span>Velocidade Máx.</span><span id="dp-maxspeed">—</span></div>
            <div class="drow"><span>Velocidade Méd.</span><span id="dp-avgspeed">—</span></div>
            <div class="drow"><span>Distância Total</span><span id="dp-dist">—</span></div>
            <div class="drow"><span>Última att.</span><span id="dp-time">—</span></div>
            <div class="drow"><span>Paradas</span><span id="dp-stopcnt">0</span></div>
            <div id="dp-stops"></div>
            <button id="btn-close-detail" onclick="closeDetail()">✕ Fechar</button>
        </div>

        <div class="legend">
            <div class="litem"><div class="lline" style="background:#4318FF"></div>Trajeto</div>
            <div class="litem"><div class="lline" style="background:#ef4444"></div>Parada</div>
        </div>
    </div>
</div>

<script>
// ── MAP INIT ──
// Set explicit pixel size before creating map
const mapEl = document.getElementById('map');
const mapWrap = document.getElementById('map-wrap');

function resizeMap() {
    mapEl.style.width  = mapWrap.offsetWidth  + 'px';
    mapEl.style.height = mapWrap.offsetHeight + 'px';
    if (window._map) window._map.invalidateSize();
}
resizeMap();
window.addEventListener('resize', resizeMap);

const map = L.map('map', { zoomControl: true }).setView([-23.5505, -46.6333], 12);
window._map = map;

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors',
    maxZoom: 19
}).addTo(map);

// Force size after a short delay (fixes timing issues)
setTimeout(() => { resizeMap(); }, 300);

// ── STATE ──
let teams = {};
let markers = {};
let routeLines = {};
let activeTeamId = null;

// ── SOCKET ── Auto-detect URL (works locally and in production)
const SOCKET_URL = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
    ? 'http://localhost:3000'
    : window.location.origin;

const socket = io(SOCKET_URL);
socket.on('connect', () => console.log('Painel conectado ao servidor'));
socket.on('disconnect', () => console.log('Painel desconectado'));

socket.on('update_teams', data => {
    teams = data;
    renderList();
    Object.keys(teams).forEach(id => updateMarker(id, teams[id]));
    updateCounters();
});

socket.on('team_location_update', ({ socketId, team }) => {
    teams[socketId] = team;
    updateMarker(socketId, team);
    updateCardEl(socketId, team);
    updateCounters();
    if (activeTeamId === socketId) openDetail(socketId);
});

// ── ICON ──
function makeIcon(name, status) {
    const bg = status === 'Offline' ? '#ef4444' : '#22c55e';
    const letter = (name || '?')[0].toUpperCase();
    return L.divIcon({
        className: '',
        html: `<div style="width:34px;height:34px;border-radius:50% 50% 50% 0;background:${bg};transform:rotate(-45deg);border:2px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;">
                   <span style="transform:rotate(45deg);font-size:14px;font-weight:700;color:#fff;">${letter}</span>
               </div>`,
        iconSize: [34, 34],
        iconAnchor: [17, 34],
        popupAnchor: [0, -36]
    });
}

// ── MARKER ──
function updateMarker(id, team) {
    if (!team.lastLocation) return;
    const { lat, lng } = team.lastLocation;
    if (markers[id]) {
        markers[id].setLatLng([lat, lng]);
        markers[id].setIcon(makeIcon(team.name, team.status));
        markers[id].setPopupContent(`<b>${team.name}</b><br>Status: ${team.status}`);
    } else {
        markers[id] = L.marker([lat, lng], { icon: makeIcon(team.name, team.status) })
            .addTo(map)
            .bindPopup(`<b>${team.name}</b><br>Status: ${team.status}`);
    }

    if (team.history && team.history.length > 1) {
        const pts = team.history.map(h => [h.lat, h.lng]);
        if (routeLines[id]) routeLines[id].setLatLngs(pts);
        else routeLines[id] = L.polyline(pts, { color:'#4318FF', weight:3, opacity:.8 }).addTo(map);
    }
}

// ── LIST ──
function renderList() {
    const el = document.getElementById('team-list');
    el.innerHTML = '';
    const ids = Object.keys(teams);
    if (!ids.length) { el.innerHTML = '<div class="empty-state">Nenhuma equipe conectada.</div>'; return; }
    ids.forEach(id => {
        const div = document.createElement('div');
        div.id = 'card-' + id;
        div.className = 'tcard';
        el.appendChild(div);
        fillCard(div, id, teams[id]);
    });
}

function updateCardEl(id, team) {
    let el = document.getElementById('card-' + id);
    if (!el) {
        el = document.createElement('div');
        el.id = 'card-' + id;
        el.className = 'tcard';
        document.getElementById('team-list').appendChild(el);
    }
    fillCard(el, id, team);
}

function fillCard(el, id, team) {
    const speed   = team.lastLocation ? (team.lastLocation.speed || 0) : 0;
    const maxSpd  = team.maxSpeed || 0;
    const dist    = team.totalDistance || 0;
    const lastUpd = team.lastUpdate ? new Date(team.lastUpdate).toLocaleTimeString('pt-BR') : '—';
    const badgeCls = team.status === 'Offline' ? 'badge badge-off' : 'badge badge-on';

    el.innerHTML = `
        <div class="tcard-top">
            <span class="tcard-name">${team.name}</span>
            <span class="${badgeCls}">${team.status}</span>
        </div>
        <div class="tcard-metrics">
            <div class="tm"><b>${speed.toFixed(0)} km/h</b><small>Atual</small></div>
            <div class="tm"><b>${maxSpd.toFixed(0)} km/h</b><small>Máxima</small></div>
            <div class="tm"><b>${dist.toFixed(2)} km</b><small>Distância</small></div>
        </div>
        <div class="tcard-time">⏱ ${lastUpd}</div>
        <button class="btn-focus" onclick="event.stopPropagation();focusTeam('${id}')" style="margin-bottom:5px;">📍 Ver no mapa & detalhes</button>
        <button onclick="event.stopPropagation();deleteTeam('${id}')" style="width:100%;padding:6px;border:none;border-radius:6px;background:#2d1515;color:#ef4444;font-size:11px;font-weight:600;cursor:pointer;">🗑 Remover</button>
    `;
    el.onclick = () => focusTeam(id);
}

// ── DETAIL ──
function focusTeam(id) {
    const team = teams[id];
    if (!team || !team.lastLocation) return;
    activeTeamId = id;
    map.setView([team.lastLocation.lat, team.lastLocation.lng], 16, { animate: true });
    openDetail(id);
}

function openDetail(id) {
    const team = teams[id];
    if (!team) return;
    const history = team.history || [];
    const speeds  = history.map(h => h.speed || 0);
    const avgSpd  = speeds.length ? speeds.reduce((a,b)=>a+b,0)/speeds.length : 0;

    document.getElementById('dp-name').textContent     = '📍 ' + team.name;
    document.getElementById('dp-speed').textContent    = (team.lastLocation ? (team.lastLocation.speed||0) : 0).toFixed(1) + ' km/h';
    document.getElementById('dp-maxspeed').textContent = (team.maxSpeed||0).toFixed(1) + ' km/h';
    document.getElementById('dp-avgspeed').textContent = avgSpd.toFixed(1) + ' km/h';
    document.getElementById('dp-dist').textContent     = (team.totalDistance||0).toFixed(2) + ' km';
    document.getElementById('dp-time').textContent     = team.lastUpdate ? new Date(team.lastUpdate).toLocaleTimeString('pt-BR') : '—';
    document.getElementById('dp-stopcnt').textContent  = (team.stops||[]).length;

    const stopsEl = document.getElementById('dp-stops');
    stopsEl.innerHTML = '';
    (team.stops||[]).slice(-8).reverse().forEach(s => {
        const d = document.createElement('div');
        d.className = 'stop-item';
        d.textContent = '⏸ ' + new Date(s.time).toLocaleTimeString('pt-BR');
        stopsEl.appendChild(d);
    });

    document.getElementById('detail').style.display = 'block';
}

function closeDetail() {
    document.getElementById('detail').style.display = 'none';
    activeTeamId = null;
}

function updateCounters() {
    const ids = Object.keys(teams);
    document.getElementById('cnt-on').textContent    = ids.filter(id => teams[id].status !== 'Offline').length;
    document.getElementById('cnt-total').textContent = ids.length;
}

// ── CLEAR FUNCTIONS ──
function deleteTeam(id) {
    fetch(`${SOCKET_URL}/teams/${encodeURIComponent(id)}`, { method: 'DELETE' })
        .then(() => {
            delete teams[id];
            if (markers[id])    { map.removeLayer(markers[id]);    delete markers[id]; }
            if (routeLines[id]) { map.removeLayer(routeLines[id]); delete routeLines[id]; }
            const card = document.getElementById('card-' + id);
            if (card) card.remove();
            updateCounters();
        });
}

function clearOffline() {
    fetch(`${SOCKET_URL}/teams/offline`, { method: 'DELETE' })
        .then(r => r.json())
        .then(res => {
            Object.keys(teams).forEach(id => {
                if (teams[id].status === 'Offline') {
                    if (markers[id])    { map.removeLayer(markers[id]);    delete markers[id]; }
                    if (routeLines[id]) { map.removeLayer(routeLines[id]); delete routeLines[id]; }
                    delete teams[id];
                }
            });
            renderList();
            updateCounters();
        });
}

function clearAll() {
    if (!confirm('Remover TODAS as equipes do painel?')) return;
    Object.keys(teams).forEach(id => {
        fetch(`${SOCKET_URL}/teams/${encodeURIComponent(id)}`, { method: 'DELETE' });
        if (markers[id])    { map.removeLayer(markers[id]);    delete markers[id]; }
        if (routeLines[id]) { map.removeLayer(routeLines[id]); delete routeLines[id]; }
    });
    teams = {};
    renderList();
    updateCounters();
    closeDetail();
}
</script>
</body>
</html>
