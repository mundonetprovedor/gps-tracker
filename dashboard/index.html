<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundonet Fleet — Intelligent Monitoring System</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-sidebar: #0b0e14;
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --primary: #2563eb;
            --primary-light: #3b82f6;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --border: rgba(255, 255, 255, 0.08);
            --glass: rgba(30, 41, 59, 0.7);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg-main); color: var(--text-main); height: 100vh; overflow: hidden; display: flex; }

        /* ── SIDEBAR ── */
        .sidebar { width: 260px; background: #ffffff !important; border-right: 1px solid #e2e8f0; display: flex; flex-direction: column; flex-shrink: 0; padding: 24px 16px; }
        .sidebar-brand { display: flex; align-items: center; justify-content: center; margin-bottom: 40px; padding: 0 8px; }
        .sidebar-brand img { height: 50px; width: auto; object-fit: contain; }
        .sidebar-brand b { display: none; }

        .nav-section { margin-bottom: 24px; }
        .nav-label { font-size: 11px; font-weight: 800; color: #a3b1c6; text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 16px; padding-left: 12px; }
        .nav-item { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 14px; cursor: pointer; color: #718096; transition: 0.2s; font-size: 15px; font-weight: 600; margin-bottom: 6px; }
        .nav-item i { width: 20px; height: 20px; stroke-width: 2px; }
        .nav-item:hover { background: #f7fafc; color: #2d3748; }
        .nav-item.active { background: #2b60e6; color: white; box-shadow: 0 10px 20px rgba(43, 96, 230, 0.25); }
        .nav-badge { margin-left: auto; background: #f56565; color: white; font-size: 11px; padding: 2px 8px; border-radius: 8px; font-weight: 800; }

        .sidebar-status { margin-top: auto; background: #1a202c; border-radius: 20px; padding: 20px; border: 1px solid rgba(255,255,255,0.1); color: white; }
        .status-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 10px; }
        .progress-bar { height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; margin: 10px 0; }
        .progress-fill { height: 100%; background: #48bb78; border-radius: 3px; }

        /* ── MAIN         /* ── MAIN CONTENT (MAP FOCUS) ── */
        .main-wrapper { flex: 1; position: relative; display: flex; flex-direction: column; }
        
        .map-container { position: absolute; inset: 0; z-index: 1; }
        #map { height: 100%; width: 100%; }

        /* Floating Overlay Panels */
        .overlay-panels { position: absolute; inset: 0; pointer-events: none; z-index: 10; padding: 24px; display: flex; flex-direction: column; gap: 20px; }
        .overlay-panels > * { pointer-events: auto; }

        .top-overlay-row {
            display: flex; justify-content: space-between; align-items: flex-start;
            width: 100%; pointer-events: none;
        }
        .top-overlay-row > * { pointer-events: auto; }

        .stats-overlay { display: flex; gap: 10px; width: 320px; }
        .stat-widget { 
            flex: 1; background: var(--glass); backdrop-filter: blur(12px); border: 1px solid var(--border);
            padding: 10px 8px; border-radius: 14px; display: flex; flex-direction: column; 
            align-items: center; gap: 4px; box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            transition: 0.2s;
        }
        .stat-widget:hover { border-color: var(--primary-light); transform: translateY(-2px); }
        .stat-widget i { color: var(--primary-light); width: 16px; height: 16px; }
        .stat-widget .val { font-size: 15px; font-weight: 800; color: white; }
        .stat-widget .lab { font-size: 9px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; text-align: center; }

        /* Left Sidebar Panel (Teams) */
        .teams-panel {
            width: 320px; flex: 1; margin-bottom: 0;
            background: var(--glass); backdrop-filter: blur(16px); border: 1px solid var(--border);
            border-radius: 24px; display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }
        .panel-header { padding: 20px; border-bottom: 1px solid var(--border); background: rgba(255,255,255,0.03); }
        .panel-header h3 { font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
        .teams-list-scroll { flex: 1; overflow-y: auto; padding: 12px; }
        
        .compact-team-row {
            padding: 12px; border-radius: 16px; margin-bottom: 8px; cursor: pointer;
            transition: 0.2s; border: 1px solid transparent; display: flex; align-items: center; gap: 12px;
            background: rgba(255,255,255,0.03);
        }
        .compact-team-row:hover { background: rgba(255,255,255,0.08); border-color: var(--border); }
        .compact-team-row.active { background: var(--primary); border-color: var(--primary-light); }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; }
        .dot-online { background: var(--success); box-shadow: 0 0 10px var(--success); }
        .dot-offline { background: var(--text-muted); }

        .status-filters { display: flex; gap: 8px; margin-top: 12px; }
        .filter-chip { 
            padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; 
            background: rgba(255,255,255,0.05); color: var(--text-muted); cursor: pointer; 
            transition: 0.2s; border: 1px solid var(--border);
        }
        .filter-chip:hover { background: rgba(255,255,255,0.1); }
        .filter-chip.active { background: var(--primary); color: white; border-color: var(--primary-light); }

        /* Right Activity Panel */
        .activity-panel {
            position: absolute; right: 24px; bottom: 24px; width: 350px; max-height: 250px;
            background: var(--glass); backdrop-filter: blur(12px); border: 1px solid var(--border);
            border-radius: 20px; padding: 16px; overflow: hidden; display: flex; flex-direction: column;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }
        .activity-item {
            display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .activity-item:last-child { border-bottom: none; }
        .activity-icon { flex-shrink: 0; }
        
        /* Map Controls Overlay */
        .map-controls { position: absolute; right: 24px; top: 100px; display: flex; flex-direction: column; gap: 10px; }
        .map-btn {
            width: 44px; height: 44px; background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.2s; color: white;
        }
        .map-btn:hover { background: var(--primary); }

        .search-bar-floating {
            width: 400px; background: var(--glass); backdrop-filter: blur(12px); border: 1px solid var(--border);
            border-radius: 16px; padding: 0 16px; height: 44px; display: flex; align-items: center; gap: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        .search-bar-floating input { background: transparent; border: none; color: white; flex: 1; outline: none; font-size: 14px; }
        
        /* Map Customizations */
        .map-search { position: absolute; top: 20px; left: 20px; right: 20px; z-index: 1000; display: flex; gap: 10px; }
        .map-search input { flex: 1; padding: 12px 20px; border-radius: 14px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); border: 1px solid var(--border); color: white; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        
        .map-layers { position: absolute; bottom: 20px; right: 20px; z-index: 1000; background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border); display: flex; overflow: hidden; }
        .layer-btn { padding: 10px 15px; cursor: pointer; font-size: 12px; font-weight: 700; transition: 0.2s; }
        .layer-btn:hover { background: rgba(255,255,255,0.05); }
        .layer-btn.active { background: var(--primary); color: white; }

        /* Custom Marker */
        .custom-marker { width: 44px !important; height: 44px !important; border-radius: 14px; background: white; border: 3px solid var(--primary); display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
        .marker-inner { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; }

        @media (max-width: 1400px) {
            .dashboard-content { grid-template-columns: 1fr; }
            .right-col { flex-direction: row; flex-wrap: wrap; }
            .details-card, .activity-card, .chart-card { flex: 1; min-width: 350px; }
        }
        .team-marker-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .team-marker-label {
            background: rgba(15, 23, 42, 0.95);
            color: white;
            padding: 3px 10px;
            border-radius: 6px;
            font-weight: 800;
            font-size: 12px;
            border: 1px solid var(--accent);
            margin-bottom: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            white-space: nowrap;
            letter-spacing: 0.5px;
        }
        .team-marker-icon-box {
            background-color: var(--primary);
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            border: 2px solid white;
            color: white;
            box-shadow: var(--shadow-lg);
        }
        .route-line {
            stroke-dasharray: 8, 8;
            animation: dash 20s linear infinite;
        }
        @keyframes dash {
            to { stroke-dashoffset: -1000; }
        }

        /* Toast Notifications */
        #notification-container {
            position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
            z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none;
        }
        .toast {
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px);
            border: 1px solid var(--border); color: white; padding: 12px 20px;
            border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex; align-items: center; gap: 12px; pointer-events: auto;
            animation: slideIn 0.3s ease-out forwards; min-width: 300px;
        }
        @keyframes slideIn {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .toast.DS { border-left: 4px solid var(--warning); }
        .toast.EX { border-left: 4px solid var(--success); }
    </style>
</head>
<body>

    <!-- ── SIDEBAR ── -->
    <div class="sidebar">
        <div class="sidebar-brand">
            <img src="mundonet_brand.png" alt="Mundonet" style="height: 48px;">
        </div>
        
        <div class="nav-section">
            <p class="nav-label">Menu Principal</p>
            <div class="nav-item active" onclick="switchTab('monitor')"><i data-lucide="layout-dashboard"></i><span>Monitoramento</span></div>
            <div class="nav-item"><i data-lucide="users"></i><span>Equipes</span></div>
            <div class="nav-item"><i data-lucide="smartphone"></i><span>Dispositivos</span></div>
            <div class="nav-item"><i data-lucide="clipboard-list"></i><span>Ordens de Serviço</span></div>
            <div class="nav-item"><i data-lucide="bell"></i><span>Alertas</span><span class="nav-badge" id="alert-count">5</span></div>
            <div class="nav-item"><i data-lucide="bar-chart-3"></i><span>Relatórios</span></div>

            <div class="nav-item"><i data-lucide="settings"></i><span>Configurações</span></div>
        </div>
        <div class="weather-widget" id="weather-box">
            <div class="weather-main">
                <i data-lucide="cloud-rain" id="weather-icon"></i>
                <div>
                    <div id="weather-temp">--°C</div>
                    <div id="weather-desc">Carregando clima...</div>
                </div>
            </div>
            <div class="weather-rain-chance">
                <i data-lucide="droplets" size="12"></i> 
                <span>Chuva: <b id="rain-prob">--%</b></span>
            </div>
        </div>

        <style>
            .weather-widget { 
                margin-bottom: 16px; background: #f7fafc; border-radius: 16px; padding: 16px; 
                border: 1px solid #e2e8f0; color: #2d3748;
            }
            .weather-main { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
            .weather-main i { color: #3b82f6; width: 28px; height: 28px; }
            #weather-temp { font-size: 20px; font-weight: 800; line-height: 1; }
            #weather-desc { font-size: 11px; color: #718096; font-weight: 600; text-transform: capitalize; }
            .weather-rain-chance { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #4a5568; font-weight: 600; }
            .weather-rain-chance b { color: #3b82f6; }
        </style>


    </div>

    <div class="main-wrapper">
        <div class="map-container">
            <div id="map"></div>
        </div>

        <div class="overlay-panels">
            <div class="top-overlay-row">
                <!-- Top Stats -->
                <div class="stats-overlay">
                    <div class="stat-widget">
                        <i data-lucide="users"></i>
                        <div class="lab">Equipes Ativas</div>
                        <div class="val" id="stats-active-teams">0 / 0</div>
                    </div>
                    <div class="stat-widget">
                        <i data-lucide="clipboard-list"></i>
                        <div class="lab">O.S. Hoje</div>
                        <div class="val" id="stats-total-os">0</div>
                    </div>
                    <div class="stat-widget">
                        <i data-lucide="alert-circle"></i>
                        <div class="lab">Alertas</div>
                        <div class="val" id="stats-alerts">0</div>
                    </div>
                </div>
                
                <div class="search-bar-floating">
                    <i data-lucide="search" size="18" style="color: var(--text-muted)"></i>
                    <input type="text" placeholder="Buscar técnico ou endereço...">
                </div>
            </div>

            <!-- Left Panel: Teams -->
            <div class="teams-panel">
                <div class="panel-header">
                    <h3><i data-lucide="navigation"></i> Monitoramento</h3>
                    <div class="status-filters">
                        <div class="filter-chip active" data-filter="all" onclick="setStatusFilter('all')">Todos</div>
                        <div class="filter-chip" data-filter="Online" onclick="setStatusFilter('Online')">Online</div>
                        <div class="filter-chip" data-filter="Offline" onclick="setStatusFilter('Offline')">Offline</div>
                    </div>
                </div>
                <div class="teams-list-scroll" id="teams-list-floating">
                    <!-- Teams will be rendered here -->
                </div>
            </div>

            <!-- Right Panel: Activity -->
            <div class="activity-panel">
                <div class="panel-header" style="padding: 10px 0; margin-bottom: 10px;">
                    <h3 style="font-size: 14px;"><i data-lucide="activity"></i> Atividades Recentes</h3>
                </div>
                <div class="activity-list" id="activity-list-floating" style="overflow-y: auto; flex: 1;">
                    <!-- Activities will be rendered here -->
                </div>
            </div>

            <!-- Map Controls -->
            <div class="map-controls">
                <div class="map-btn" onclick="setMapLayer('standard')"><i data-lucide="map"></i></div>
                <div class="map-btn" onclick="setMapLayer('satellite')"><i data-lucide="layers"></i></div>
                <div class="map-btn" onclick="centerMap()"><i data-lucide="crosshair"></i></div>
            </div>
        </div>
    </div>

    <div id="notification-container"></div>

    <script>
        let map, stdLayer, satLayer;
        let teams = {};
        let markers = {};
        let osMarkers = {};
        let routeLines = {}; 
        let selectedTeamId = null;
        let currentStatusFilter = 'all';

        const STATUS_MAP = {
            'A': { label: 'Aberto', color: '#3b82f6' },
            'AN': { label: 'Análise', color: '#8b5cf6' },
            'EN': { label: 'Encaminhada', color: '#f59e0b' },
            'AS': { label: 'Assumida', color: '#06b6d4' },
            'AG': { label: 'Agendado', color: '#14b8a6' },
            'DS': { label: 'Deslocamento', color: '#eab308' },
            'EX': { label: 'Execução', color: '#10b981' },
            'F': { label: 'Finalizado', color: '#94a3b8' }
        };

        // ── INIT ──
        document.addEventListener('DOMContentLoaded', async () => {
            lucide.createIcons();
            
            if (!localStorage.getItem('m_token')) {
                try {
                    const res = await fetch('/auth/login', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({username: 'admin', password: 'admin123'})
                    });
                    const data = await res.json();
                    if (data.token) localStorage.setItem('m_token', data.token);
                } catch (e) { console.error('Auto-login falhou'); }
            }

            initMap();
            initSocket();
            loadDashboardData();
            updateWeather();
            
            setInterval(loadDashboardData, 30000);
            setInterval(updateWeather, 1800000); // 30 min
        });

        async function updateWeather() {
            try {
                const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=-2.53&longitude=-44.30&current=temperature_2m,weather_code&hourly=precipitation_probability&timezone=auto');
                const data = await res.json();
                const temp = Math.round(data.current.temperature_2m);
                const code = data.current.weather_code;
                const rainProb = data.hourly.precipitation_probability[0];
                
                document.getElementById('weather-temp').innerText = `${temp}°C`;
                document.getElementById('rain-prob').innerText = `${rainProb}%`;
                
                let desc = 'Céu Limpo';
                let icon = 'sun';
                if (code > 0) { desc = 'Nublado'; icon = 'cloud'; }
                if (code > 50) { desc = 'Chuva'; icon = 'cloud-rain'; }
                if (code > 80) { desc = 'Trovoadas'; icon = 'cloud-lightning'; }
                
                document.getElementById('weather-desc').innerText = desc;
                document.getElementById('weather-icon').setAttribute('data-lucide', icon);
                lucide.createIcons();
            } catch (e) { console.error('Weather error:', e); }
        }

        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([-2.53, -44.30], 12);
            stdLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            satLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}');
            L.control.zoom({ position: 'bottomright' }).addTo(map);

            map.on('popupopen', () => lucide.createIcons());
        }

        function setMapLayer(type) {
            if (type === 'satellite') {
                map.removeLayer(stdLayer);
                satLayer.addTo(map);
            } else {
                map.removeLayer(satLayer);
                stdLayer.addTo(map);
            }
        }

        function centerMap() {
            const activeMarkers = Object.values(markers);
            if (activeMarkers.length > 0) {
                const group = new L.featureGroup(activeMarkers);
                map.fitBounds(group.getBounds().pad(0.2));
            }
        }

        function initSocket() {
            const socket = io(window.location.origin);
            socket.on('update_teams', data => {
                teams = data;
                renderTeamsPanel();
                updateMarkers();
            });
            socket.on('team_location_update', data => {
                const id = data.id || data.socketId;
                teams[id] = data.team;
                updateMarker(id, data.team);
                renderTeamsPanel();
            });
            socket.on('team_removed', id => {
                delete teams[id];
                if (markers[id]) { map.removeLayer(markers[id]); delete markers[id]; }
                renderTeamsPanel();
            });
            socket.on('os_synced', loadDashboardData);
            
            socket.on('status_notification', data => {
                showToast(data.message, data.type);
            });
        }

        function showToast(message, type) {
            const container = document.getElementById('notification-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            const icon = type === 'DS' ? 'truck' : 'play-circle';
            const color = type === 'DS' ? 'var(--warning)' : 'var(--success)';
            
            toast.innerHTML = `
                <div style="background:${color}20; color:${color}; padding:8px; border-radius:8px; display:flex;">
                    <i data-lucide="${icon}" size="18"></i>
                </div>
                <div style="font-size:13px; font-weight:600;">${message}</div>
            `;
            container.appendChild(toast);
            lucide.createIcons();
            
            setTimeout(() => {
                toast.style.animation = 'slideIn 0.3s ease-out reverse forwards';
                setTimeout(() => toast.remove(), 300);
            }, 5000);
        }

        async function loadDashboardData() {
            const headers = { 'Authorization': `Bearer ${localStorage.getItem('m_token')}` };
            try {
                // Fetch Teams first to ensure the list is populated
                const teamsArray = await (await fetch('/api/teams', { headers })).json();
                teamsArray.forEach(t => { teams = { ...teams, [t.id]: t }; });

                const stats = await (await fetch('/api/dashboard/stats', { headers })).json();
                const os = await (await fetch('/api/service-orders', { headers })).json();
                const activities = await (await fetch('/api/activities', { headers })).json();

                document.getElementById('stats-active-teams').innerText = `${stats.active || 0}/${stats.total || 0}`;
                document.getElementById('stats-total-os').innerText = os.length;
                document.getElementById('stats-alerts').innerText = stats.alerts || 0;
                document.getElementById('alert-count').innerText = stats.alerts || 0;

                updateOSMarkers(os);
                updateRouteLines(os);
                renderActivitiesPanel(activities);
                renderTeamsPanel();
                updateMarkers();
            } catch (e) { console.error('Data Load Error:', e); }
        }

        function updateOSMarkers(osList) {
            osList.forEach(os => {
                if (!os.lat || !os.lng) return;
                const statusInfo = STATUS_MAP[os.status] || { label: 'Outro', color: '#fff' };
                const icon = L.divIcon({
                    className: 'os-marker',
                    html: `<div style="background:${statusInfo.color}; width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:3px solid white; box-shadow:0 4px 10px rgba(0,0,0,0.3);"><i data-lucide="clipboard" style="width:14px; height:14px; color:white;"></i></div>`,
                    iconSize: [30, 30],
                    iconAnchor: [15, 15]
                });

                if (!osMarkers[os.ixcId]) {
                    let addressSummary = os.address || 'Endereço não informado';
                    // Remove prefixos comuns do IXC (Estado, Cidade, CEP)
                    addressSummary = addressSummary.replace(/^MA\s+S[ãa]o\s+Lu[íi]s\s+\d{5}-\d{3}\s+/, '');
                    
                    const dateStr = os.scheduledDate ? new Date(os.scheduledDate).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : 'Não agendada';
                    
                    const popupContent = `
                        <div style="min-width: 200px; padding: 4px;">
                            <div style="font-weight: 800; color: #1e293b; font-size: 14px; margin-bottom: 8px; border-bottom: 1.5px solid #e2e8f0; padding-bottom: 4px;">OS ${os.number}</div>
                            <div style="font-size: 12px; margin-bottom: 4px;"><b>Cliente:</b> ${os.client}</div>
                            <div style="font-size: 12px; margin-bottom: 4px;"><b>Assunto:</b> ${os.subject || 'Não informado'}</div>
                            <div style="font-size: 11px; color: #2563eb; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 4px;">
                                <i data-lucide="calendar" style="width:12px; height:12px;"></i> ${dateStr}
                            </div>
                            <div style="font-size: 11px; color: #475569; background: #f1f5f9; padding: 6px; border-radius: 8px; display: flex; align-items: flex-start; gap: 6px;">
                                <i data-lucide="map-pin" style="width:12px; height:12px; margin-top: 2px; flex-shrink: 0;"></i> 
                                <span>${addressSummary}</span>
                            </div>
                        </div>
                    `;
                    osMarkers[os.ixcId] = L.marker([os.lat, os.lng], { icon }).addTo(map).bindPopup(popupContent);
                } else {
                    osMarkers[os.ixcId].setLatLng([os.lat, os.lng]).setIcon(icon);
                }
            });
            lucide.createIcons();
        }

        function updateRouteLines(osList) {
            Object.values(routeLines).forEach(l => map.removeLayer(l));
            routeLines = {};
            osList.forEach(os => {
                if (!os.teamId || !os.lat || !os.lng) return;
                const team = teams[os.teamId] || Object.values(teams).find(t => t.name === os.teamId || t.id === os.teamId);
                if (team && team.lastLocation) {
                    const statusInfo = STATUS_MAP[os.status] || { color: '#3b82f6' };
                    routeLines[os.ixcId] = L.polyline([[team.lastLocation.lat, team.lastLocation.lng], [os.lat, os.lng]], { color: statusInfo.color, weight: 3, opacity: 0.6, className: 'route-line' }).addTo(map);
                }
            });
        }

        function renderTeamsPanel() {
            const list = document.getElementById('teams-list-floating');
            if (!list) return;
            list.innerHTML = '';
            
            const sortedTeams = Object.entries(teams)
                .filter(([id, team]) => {
                    if (currentStatusFilter === 'all') return true;
                    return team.status === currentStatusFilter;
                })
                .sort((a, b) => {
                    const teamA = a[1];
                    const teamB = b[1];
                    if (teamA.status === 'Online' && teamB.status !== 'Online') return -1;
                    if (teamA.status !== 'Online' && teamB.status === 'Online') return 1;
                    return teamA.name.localeCompare(teamB.name);
                });

            sortedTeams.forEach(([id, team]) => {
                const row = document.createElement('div');
                row.className = `compact-team-row ${selectedTeamId === id ? 'active' : ''}`;
                row.onclick = () => { selectedTeamId = id; selectTeam(id); renderTeamsPanel(); };
                
                const batteryPercent = team.battery !== undefined ? Math.round(team.battery) : 100;
                const batteryColor = batteryPercent < 20 ? 'var(--danger)' : (batteryPercent < 50 ? 'var(--warning)' : 'var(--success)');
                
                row.innerHTML = `
                    <div class="status-dot ${team.status === 'Online' ? 'dot-online' : 'dot-offline'}"></div>
                    <div style="flex:1">
                        <div style="font-size:13px; font-weight:700;">${team.name}</div>
                        <div style="font-size:10px; color:var(--text-muted)">${team.status} • <span style="color:${batteryColor}">${batteryPercent}% Bat.</span></div>
                    </div>
                    <i data-lucide="chevron-right" size="14" style="opacity:0.3"></i>
                `;
                list.appendChild(row);
            });
            lucide.createIcons();
        }

        function renderActivitiesPanel(activities) {
            const list = document.getElementById('activity-list-floating');
            if (!list) return;
            list.innerHTML = '';
            activities.forEach(a => {
                const item = document.createElement('div');
                item.className = 'activity-item';
                
                // Melhor lógica de ícones
                let icon = 'bell';
                let color = 'var(--primary)';
                
                if (a.type === 'OS') {
                    icon = 'clipboard-list';
                    color = '#10b981'; // Verde esmeralda
                } else if (a.critical || a.content.toLowerCase().includes('offline')) {
                    icon = 'alert-octagon';
                    color = '#ef4444'; // Vermelho
                } else {
                    icon = 'alert-triangle';
                    color = '#f59e0b'; // Âmbar
                }

                item.innerHTML = `
                    <div class="activity-icon" style="background: ${color}15; color: ${color}; min-width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center;">
                        <i data-lucide="${icon}" style="width: 16px; height: 16px;"></i>
                    </div>
                    <div class="activity-content" style="flex: 1; margin-left: 12px;">
                        <div style="font-size: 13px; font-weight: 700; color: white; line-height: 1.2;">${a.content}</div>
                        <div style="font-size: 11px; color: var(--text-muted); margin-top: 2px;">${a.client || a.device || ''}</div>
                    </div>
                    <div class="activity-time" style="font-size: 10px; font-weight: 700; color: #94a3b8;">${new Date(a.time).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
                `;
                list.appendChild(item);
            });
            lucide.createIcons();
        }

        function updateMarker(id, team) {
            if (!team.lastLocation) return;
            const icon = L.divIcon({
                className: 'custom-team-icon',
                html: `<div class="team-marker-container">
                        <div class="team-marker-label">${team.name}</div>
                        <div class="team-marker-icon-box" style="transform: rotate(${team.lastLocation.heading || 0}deg)">
                            <i data-lucide="car"></i>
                        </div>
                       </div>`,
                iconSize: [100, 70], iconAnchor: [50, 60]
            });
            if (!markers[id]) {
                markers[id] = L.marker([team.lastLocation.lat, team.lastLocation.lng], { icon }).addTo(map);
            } else {
                markers[id].setLatLng([team.lastLocation.lat, team.lastLocation.lng]).setIcon(icon);
            }
            lucide.createIcons();
        }

        function updateMarkers() { Object.keys(teams).forEach(id => updateMarker(id, teams[id])); }

        function setStatusFilter(filter) {
            currentStatusFilter = filter;
            document.querySelectorAll('.filter-chip').forEach(c => {
                c.classList.toggle('active', c.getAttribute('data-filter') === filter);
            });
            renderTeamsPanel();
        }

        function selectTeam(id) {
            const team = teams[id];
            if (team?.lastLocation) map.setView([team.lastLocation.lat, team.lastLocation.lng], 16);
        }
    </script>
</body>
</html>
