<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundonet Tracker — Monitoramento</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        :root {
            --m-blue: #002d62;
            --m-light: #39B8FF;
            --bg-dark: #0b0e14;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        html, body { width:100%; height:100%; font-family:'Inter', sans-serif; background:var(--bg-dark); color:#e2e8f0; overflow:hidden; }

        #app { display:none; width:100vw; height:100vh; } /* Hidden until login */

        /* ── LOGIN OVERLAY ── */
        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(135deg, #002d62 0%, #000c1d 100%);
            display: flex; align-items: center; justify-content: center; z-index: 9999;
        }
        .login-card {
            background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
            padding: 40px; border-radius: 24px; width: 400px; text-align: center;
            backdrop-filter: blur(20px);
        }
        .login-card img { width: 220px; margin-bottom: 30px; }
        .login-card input {
            width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 10px;
            border: 1px solid var(--glass-border); background: rgba(0,0,0,0.3); color: #fff;
        }
        .btn-login {
            width: 100%; padding: 14px; border: none; border-radius: 10px;
            background: var(--m-light); color: var(--m-blue); font-weight: 800; cursor: pointer;
        }

        /* ── SIDEBAR PREMIUM ── */
        .sidebar {
            width: 350px; background: linear-gradient(180deg, #001a3d 0%, #000c1d 100%);
            display: flex; flex-direction: column; border-right: 1px solid var(--glass-border);
            box-shadow: 10px 0 30px rgba(0,0,0,0.5); z-index: 1000;
        }

        .sidebar-header { padding: 25px 20px; text-align: center; border-bottom: 1px solid var(--glass-border); }
        .sidebar-header img { max-width: 180px; height: auto; margin-bottom: 10px; }
        .sidebar-header h1 { font-size: 13px; letter-spacing: 2px; color: var(--m-light); }

        #search-container { padding: 15px 20px; }
        #search-input {
            width: 100%; padding: 10px 15px; border-radius: 10px; border: 1px solid var(--glass-border);
            background: var(--glass); color: #fff; font-size: 13px;
        }

        #stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 20px 20px; }
        .sbox { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 12px; padding: 15px; text-align: center; }
        .sbox b { display: block; font-size: 24px; color: #fff; }
        .sbox small { font-size: 10px; color: var(--m-light); text-transform: uppercase; }

        #team-list { flex: 1; overflow-y: auto; padding: 0 15px 20px; }
        .tcard { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 16px; padding: 18px; margin-bottom: 12px; cursor: pointer; transition: 0.2s; }
        .tcard:hover { border-color: var(--m-light); background: rgba(255,255,255,0.08); }
        .tcard.active { border-color: var(--m-light); background: rgba(57, 184, 255, 0.1); }

        .tcard-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .tcard-name { font-size: 15px; font-weight: 700; color: #fff; }
        
        .tcard-telemetry { display: flex; gap: 10px; font-size: 10px; color: #94a3b8; margin-bottom: 12px; }
        .tel-item { display: flex; align-items: center; gap: 4px; }

        .tcard-metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
        .tm { background: rgba(0,0,0,0.3); border-radius: 8px; padding: 6px; text-align: center; }
        .tm b { display: block; font-size: 13px; color: #fff; }
        .tm small { font-size: 9px; color: #64748b; text-transform: uppercase; }

        .btn-focus {
            width: 100%; padding: 10px; border: none; border-radius: 10px;
            background: linear-gradient(135deg, var(--m-blue), var(--m-light));
            color: #fff; font-size: 12px; font-weight: 700; cursor: pointer;
        }

        /* ── MAP CONTROLS ── */
        #map-wrap { flex: 1; position: relative; }
        #map { width: 100%; height: 100%; }
        .map-controls { position: absolute; top: 20px; left: 60px; z-index: 1000; display: flex; gap: 10px; }
        .mbtn {
            background: rgba(11, 14, 20, 0.8); border: 1px solid var(--glass-border);
            color: #fff; padding: 8px 15px; border-radius: 8px; font-size: 11px; cursor: pointer;
            backdrop-filter: blur(10px);
        }
        .mbtn.active { background: var(--m-light); color: var(--m-blue); font-weight: 800; }

        .legend {
            position: absolute; bottom: 30px; left: 30px; z-index: 1000;
            background: rgba(11, 14, 20, 0.8); border-radius: 12px; padding: 12px;
        }
        .litem { display: flex; align-items: center; gap: 8px; font-size: 11px; margin-bottom: 4px; }
        .lline { width: 20px; height: 3px; border-radius: 2px; }

        /* ── CUSTOM MARKER ── */
        .custom-marker {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 80px !important;
            height: 80px !important;
        }
        .marker-label {
            background: rgba(0, 45, 98, 0.9);
            color: #fff;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 800;
            white-space: nowrap;
            border: 1px solid var(--m-light);
            margin-bottom: 2px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            text-transform: uppercase;
            backdrop-filter: blur(5px);
        }
        .marker-icon-img {
            width: 42px !important;
            height: 42px !important;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid var(--m-light);
            background: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="login-card">
        <img src="mundonet_brand.png" alt="Mundonet">
        <h2 style="margin-bottom: 20px;">Acesso Restrito</h2>
        <input type="text" id="user" placeholder="Usuário">
        <input type="password" id="pass" placeholder="Senha">
        <button class="btn-login" onclick="login()">ENTRAR NO PAINEL</button>
        <p id="login-err" style="color: #ff4d4d; font-size: 12px; margin-top: 15px; display: none;">Login ou senha incorretos</p>
    </div>
</div>

<div id="app">
    <div class="sidebar">
        <div class="sidebar-header">
            <img src="mundonet_brand.png" alt="Mundonet">
            <h1>MUNDONET TRACKER</h1>
        </div>
        <div id="search-container">
            <input type="text" id="search-input" placeholder="🔍 Buscar técnico..." oninput="filterTeams()">
        </div>
        <div id="stats">
            <div class="sbox"><b id="cnt-on">0</b><small>Online</small></div>
            <div class="sbox"><b id="cnt-total">0</b><small>Total</small></div>
        </div>
        <div id="team-list"></div>
    </div>

    <div id="map-wrap">
        <div class="map-controls">
            <button id="btn-map-std" class="mbtn active" onclick="setMapLayer('std')">PADRÃO</button>
            <button id="btn-map-sat" class="mbtn" onclick="setMapLayer('sat')">SATÉLITE</button>
        </div>
        <div id="map"></div>
        <div class="legend">
            <div class="litem"><div class="lline" style="background:#39B8FF"></div>Trajeto</div>
            <div class="litem"><div class="lline" style="background:#ff4d4d"></div>Parada</div>
        </div>
    </div>
</div>

<script>
let teams = {};
let markers = {};
let paths = {};
let selectedTeamId = null;
let map, stdLayer, satLayer;
let currentSearch = "";

// ── AUTH LOGIC ──
async function login() {
    const user = document.getElementById('user').value;
    const pass = document.getElementById('pass').value;
    const res = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: user, password: pass })
    });
    if (res.ok) {
        const data = await res.json();
        localStorage.setItem('m_token', data.token);
        initApp();
    } else {
        document.getElementById('login-err').style.display = 'block';
    }
}

function initApp() {
    document.getElementById('login-overlay').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    initMap();
    initSocket();
}

// ── MAP LOGIC ──
function initMap() {
    map = L.map('map', { zoomControl: false }).setView([-23.55, -46.63], 12);
    
    stdLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');
    satLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}');
    
    stdLayer.addTo(map);
    L.control.zoom({ position: 'topright' }).addTo(map);
}

function setMapLayer(type) {
    if (type === 'sat') {
        map.removeLayer(stdLayer);
        satLayer.addTo(map);
        document.getElementById('btn-map-sat').classList.add('active');
        document.getElementById('btn-map-std').classList.remove('active');
    } else {
        map.removeLayer(satLayer);
        stdLayer.addTo(map);
        document.getElementById('btn-map-std').classList.add('active');
        document.getElementById('btn-map-sat').classList.remove('active');
    }
}

// ── SOCKET & DATA ──
function initSocket() {
    const socket = io();
    socket.on('update_teams', data => { 
        teams = data; 
        renderList(); 
        // Desenhar todos os marcadores já conhecidos
        Object.keys(teams).forEach(id => updateMarker(id, teams[id]));
    });
    socket.on('team_location_update', data => {
        const team = data.team;
        teams[data.socketId] = team;
        updateMarker(data.socketId, team);
        renderList();
    });
}

function updateMarker(id, team) {
    if (!team.lastLocation) return;
    const newPos = [team.lastLocation.lat, team.lastLocation.lng];

    const customIcon = L.divIcon({
        className: 'custom-marker',
        html: `
            <div class="marker-label">${team.name}</div>
            <img src="car_icon.png" class="marker-icon-img">
        `,
        iconSize: [80, 80],
        iconAnchor: [40, 80]
    });

    if (!markers[id]) {
        markers[id] = L.marker(newPos, { icon: customIcon }).addTo(map).bindPopup(team.name);
        paths[id] = L.polyline([], { color: '#39B8FF', weight: 3 }).addTo(map);
    } else {
        // Atualizar ícone (caso o nome mude) e animar
        markers[id].setIcon(customIcon);
        const from = markers[id].getLatLng();
        const to = L.latLng(newPos);
        animateMarker(markers[id], from, to, 2000);
    }

    if (selectedTeamId === id) map.panTo(newPos);
}

function animateMarker(marker, from, to, duration) {
    const start = performance.now();
    function tick(now) {
        const elapsed = now - start;
        const progress = Math.min(elapsed / duration, 1);
        const lat = from.lat + (to.lat - from.lat) * progress;
        const lng = from.lng + (to.lng - from.lng) * progress;
        marker.setLatLng([lat, lng]);
        if (progress < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
}

function filterTeams() {
    currentSearch = document.getElementById('search-input').value.toLowerCase();
    renderList();
}

function renderList() {
    const list = document.getElementById('team-list');
    list.innerHTML = "";
    let on = 0;

    Object.keys(teams).forEach(id => {
        const team = teams[id];
        if (team.status === 'Online') on++;
        if (currentSearch && !team.name.toLowerCase().includes(currentSearch)) return;

        const card = document.createElement('div');
        card.className = `tcard ${selectedTeamId === id ? 'active' : ''}`;
        card.onclick = () => { selectedTeamId = id; renderList(); if(team.lastLocation) map.setView([team.lastLocation.lat, team.lastLocation.lng], 16); };
        
        const batColor = team.battery < 20 ? '#ff4d4d' : (team.battery < 50 ? '#ffae00' : '#34d399');

        card.innerHTML = `
            <div class="tcard-top">
                <span class="tcard-name">${team.name}</span>
                <span class="status-badge ${team.status === 'Online' ? 'badge-on' : 'badge-off'}">${team.status}</span>
            </div>
            <div class="tcard-telemetry">
                <div class="tel-item" style="color: ${batColor}">🔋 ${team.battery || 100}%</div>
                <div class="tel-item">📡 ${team.network || '4G'}</div>
            </div>
            <div class="tcard-metrics">
                <div class="tm"><b>${(team.lastLocation?.speed || 0).toFixed(0)}</b><small>KM/H</small></div>
                <div class="tm"><b>${(team.totalDistance || 0).toFixed(1)}</b><small>Dist.</small></div>
                <div class="tm"><b>${team.stops?.length || 0}</b><small>Paradas</small></div>
            </div>
            <button class="btn-focus">VER NO MAPA</button>
        `;
        list.appendChild(card);
    });

    document.getElementById('cnt-on').innerText = on;
    document.getElementById('cnt-total').innerText = Object.keys(teams).length;
}

// Auto-init if token exists (optional)
if (localStorage.getItem('m_token')) initApp();
</script>
</body>
</html>
